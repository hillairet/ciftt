[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = ["csv_data", "settings", "ciftt"]

[project]
name = "ciftt"
version = "0.1.0"
description = "CSV Input for Feature Triage and Tracking - A tool to create or update GitHub issues from CSV input"
readme = "README.md"
authors = [
    {name = "Anthony Hillairet", email = "anthony.hillairet@gmail.com"}
]
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
ciftt = "ciftt:app"

[project.urls]
"Homepage" = "https://github.com/hillairet/ciftt"
"Bug Tracker" = "https://github.com/hillairet/ciftt/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["ENV"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true
no_implicit_reexport = false
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "ENV",
    ".venv",
    "build",
]
